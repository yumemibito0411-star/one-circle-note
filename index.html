<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONE CIRCLE ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
<style>
/* Layout: SaaS型。PCは左固定サイドバー240px＋本文、スマホは下部ナビ。細いボーダーと余白で階層、インディゴを操作色、6事業色はデータとステータスだけに使う（ChatGPTとのデザイン相談より） */
:root{
  --bg:#f7f8fa; --card:#ffffff; --ink:#172033; --sub:#64748b; --line:#e2e8f0; --hover:#eef2ff; --soft:#f1f4f8;
  --accent:#4f46e5; --accent-ink:#ffffff;
  --ok:#15803d; --warn:#b45309; --bad:#dc2626;
  --b-jinzai:#2563eb; --b-event:#0d9488; --b-estate:#d97706; --b-school:#7c3aed; --b-beauty:#db2777; --b-circle:#ea580c;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 2px 8px rgba(15,23,42,.04);
  --f-ui:"Plus Jakarta Sans","Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --f-num:"Plus Jakarta Sans",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1018; --card:#151c27; --ink:#f1f5f9; --sub:#a3b1c4; --line:#2b3545; --hover:#252c48; --soft:#1b2330;
  --accent:#a5b4fc; --accent-ink:#0b1018;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --b-jinzai:#60a5fa; --b-event:#2dd4bf; --b-estate:#fbbf24; --b-school:#a78bfa; --b-beauty:#f472b6; --b-circle:#fb923c;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1018; --card:#151c27; --ink:#f1f5f9; --sub:#a3b1c4; --line:#2b3545; --hover:#252c48; --soft:#1b2330;
  --accent:#a5b4fc; --accent-ink:#0b1018;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --b-jinzai:#60a5fa; --b-event:#2dd4bf; --b-estate:#fbbf24; --b-school:#a78bfa; --b-beauty:#f472b6; --b-circle:#fb923c;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.65;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35;font-weight:700;letter-spacing:-.005em}
h1{font-size:22px} h2{font-size:16px} h3{font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));border-right:1px solid var(--line);background:var(--card);padding:20px 12px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand b{font-weight:800;font-size:15px;letter-spacing:.01em;line-height:1.2}
.brand small{display:block;color:var(--sub);font-size:11px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--sub);font-weight:600;font-size:13.5px}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--hover);color:var(--accent)}
.nav .badge{margin-left:auto;min-width:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;text-align:center;font-family:var(--f-num);font-weight:700}
.side .foot{margin-top:auto;padding:0 8px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--sub)}
.content{min-width:0;padding-block:28px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));max-width:1240px;width:100%}
.bnav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
  .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--sub);text-decoration:none;padding:4px 0;position:relative}
  .bnav a[aria-current="page"]{color:var(--accent)}
  .bnav .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;text-align:center}
  .mtop{display:flex!important}
}
.mtop{display:none;align-items:center;gap:10px;margin-bottom:14px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.pagehead p{margin:2px 0 0;color:var(--sub);font-size:13px}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;align-items:start}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--sub)} .small{font-size:12px}
.hint{color:var(--sub);font-size:12px;margin:4px 0 0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--sub);text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;text-decoration:none;line-height:1.3}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.line{background:#06c755;border-color:#06c755;color:#fff}
.btn.warnb{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=date],input[type=number],input[type=datetime-local],input:not([type]),select,textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea{resize:vertical;line-height:1.6}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub);font-weight:600;min-width:0}
label.f > *{color:var(--ink);font-weight:400;font-size:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;background:var(--soft);white-space:nowrap;text-decoration:none}
.biz{color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.biz::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.st{border-radius:999px;font-size:11px;padding:1px 8px;font-weight:700}
.st.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.st.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.st.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.st.info{color:var(--accent);background:var(--hover)}
.temp{font-family:var(--f-num);width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;font-weight:800;font-size:11px;flex:none}
.temp.A{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)} .temp.B{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)} .temp.C{color:var(--sub);background:var(--soft)}
.notice{border-radius:10px;padding:12px 14px;font-size:13px;background:var(--card);border:1px solid var(--line)}
.notice.warn{border-color:color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--card))}
.notice.bad{border-color:color-mix(in srgb,var(--bad) 35%,var(--line));background:color-mix(in srgb,var(--bad) 6%,var(--card))}
.notice.ai{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 5%,var(--card))}
ul.plain{list-style:none;margin:0;padding:0}
ul.dots{margin:4px 0 0;padding-left:1.2em} ul.dots li{margin:2px 0}
.empty{color:var(--sub);text-align:center;padding:32px 12px;border:1px dashed var(--line);border-radius:var(--r);background:var(--card)}
.sec-title{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sec-title .muted{font-size:12px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
@media (max-width:520px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-width:0}
.kpi .lab{font-size:12px;color:var(--sub);font-weight:600}
.kpi .val{font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em}
.kpi .val small{font-size:14px;color:var(--sub);font-weight:600;letter-spacing:0}
.bar{position:relative;height:6px;border-radius:3px;background:var(--soft)}
.bar > i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--accent)}
.bar > b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35;border-radius:1px}
.pace{font-size:11px;font-weight:700;border-radius:999px;padding:0 7px}
.pace.ahead{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)} .pace.behind{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)} .pace.even{color:var(--sub);background:var(--soft)}

/* todo */
.todo li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.todo li:first-child{border-top:0;padding-top:0}
.todo .when{flex:none;width:62px;font-size:12px;font-weight:700;font-family:var(--f-num)}
.todo .when.late{color:var(--bad)} .todo .when.today{color:var(--warn)}
.todo .body{flex:1;min-width:0}
.todo .who{font-weight:700;text-decoration:none}
.todo .who:hover{color:var(--accent)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:9px 8px;text-align:center;border-top:1px solid var(--line)}
.tbl th{font-size:11px;color:var(--sub);font-weight:700;border-top:0;letter-spacing:.03em}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl td .n{font-family:var(--f-num);font-weight:700;font-size:15px;display:inline-block;min-width:28px;padding:2px 6px;border-radius:6px;text-decoration:none}
.tbl td a .n:hover{background:var(--hover);color:var(--accent)}
.tbl td .n.z{color:var(--line)}
.scroll-x{overflow-x:auto}

/* heatmap */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dow{font-size:11px;color:var(--sub);text-align:center;font-weight:600}
.cal .d{aspect-ratio:1.5;border-radius:7px;background:var(--soft);display:flex;flex-direction:column;justify-content:space-between;padding:3px 6px;font-size:10px;color:var(--sub);font-family:var(--f-num)}
.cal .d b{font-size:14px;color:var(--ink);align-self:flex-end;font-weight:700}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d.l1{background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.cal .d.l2{background:color-mix(in srgb,var(--accent) 36%,var(--card))}
.cal .d.l3{background:color-mix(in srgb,var(--accent) 70%,var(--card))}
.cal .d.l3, .cal .d.l3 b{color:var(--accent-ink)}

/* list */
.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:8px;margin-bottom:12px}
@media (max-width:640px){.filters{grid-template-columns:1fr 1fr}.filters > :first-child{grid-column:1/-1}}
.plist{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.prow{display:grid;grid-template-columns:40px minmax(0,1.3fr) minmax(0,1.6fr) minmax(0,1.3fr);gap:14px;align-items:center;padding:12px 16px;text-decoration:none;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow:hover{background:var(--soft)}
.prow .nm{font-weight:700;font-size:14.5px}
.prow .bz{display:flex;flex-wrap:wrap;gap:4px}
@media (max-width:760px){.prow{grid-template-columns:36px minmax(0,1fr)}.prow > :nth-child(n+3){grid-column:2}}

/* person */
.ptop{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ptop h1{font-size:22px}
.biztable{display:flex;flex-direction:column}
.bizrow{display:grid;grid-template-columns:100px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.bizrow:first-child{border-top:0;padding-top:0}
.bizrow .bn{display:flex;flex-direction:column;gap:2px;line-height:1.3}
.bizrow .bn small{color:var(--sub);font-size:11px}
.bizrow .fit{grid-column:1/-1;font-size:12px;color:var(--sub)}
@media (max-width:520px){.bizrow{grid-template-columns:1fr 1fr}.bizrow .bn{grid-column:1/-1;flex-direction:row;gap:8px;align-items:center}}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;font-size:13px;margin:0}
.kv dt{color:var(--sub);font-weight:600;font-size:12px;padding-top:1px}
.kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.tl{position:relative;padding-left:18px}
.tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tl li{position:relative;padding:6px 0}
.tl li::before{content:"";position:absolute;left:-17px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--c,var(--sub))}
.tl .meta{font-size:12px;color:var(--sub)}
.tl .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.preview{border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:var(--r);padding:16px;background:color-mix(in srgb,var(--accent) 4%,var(--card))}
.preview .blk{padding:9px 0;border-top:1px solid var(--line)}
.preview label.ck{display:flex;gap:8px;align-items:center;font-weight:700}
.ailabel{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--accent);background:var(--hover);border-radius:999px;padding:1px 8px}
.ailabel svg.i{width:12px;height:12px}
.ring{flex:none}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.sample-tag{font-size:10px;padding:0 6px;border-radius:4px;background:var(--soft);color:var(--sub);font-weight:700;margin-left:6px;vertical-align:middle}

/* LINE */
.linebox{background:color-mix(in srgb,#06c755 7%,var(--card));border:1px solid color-mix(in srgb,#06c755 30%,var(--line));border-radius:var(--r);padding:14px;min-width:0}
.linebox textarea{background:var(--card);font-size:13px}
.ho{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.ho:first-child{border-top:0;padding-top:0}
.ho .t{font-weight:700}
summary{cursor:pointer}
code{font-size:12px;background:var(--soft);border-radius:4px;padding:0 4px}
@media (prefers-reduced-motion:no-preference){.btn,.nav a,.prow{transition:background .16s,color .16s,border-color .16s}}
/* 日々の操作を指で押しやすくする */
.btn{min-height:36px;justify-content:center}
summary{min-height:40px;display:list-item;font-weight:700;padding:10px 0}
details[open]>summary{margin-bottom:12px}
.quick-actions{display:flex;gap:8px;flex-wrap:wrap}
.todo .body{overflow-wrap:anywhere}
@media(max-width:860px){
  input[type=text],input[type=date],input[type=number],input[type=datetime-local],input:not([type]),select,textarea,label.f > *{font-size:16px;min-height:44px}
  .bnav a{min-height:48px;justify-content:center}
  .btn{min-height:44px}
  summary{min-height:44px}
  .card{padding:16px}
  .todo li{flex-wrap:wrap;gap:8px}
  .todo .when{width:54px}
  .todo .body{flex-basis:calc(100% - 66px)}
  .quick-actions .btn{flex:1}
}
.profile-value{border:0;background:transparent;color:inherit;text-align:left;padding:6px 0;min-height:44px;width:100%;overflow-wrap:anywhere}
.kv dd,.ptop>div{min-width:0;overflow-wrap:anywhere}
.kv{align-items:center}
.kv dt{padding-top:0}
.biz-editor{border-top:1px solid var(--line);padding:10px 0;min-width:0}
.biz-editor summary{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:44px}
.biz-editor summary span{white-space:normal;overflow-wrap:anywhere}
@media(max-width:520px){.ptop{width:100%}.ptop>div{flex:1}.kv{grid-template-columns:95px minmax(0,1fr)}.row>details{max-width:100%}}
</style>

<div class="app">
  <aside class="side" aria-label="メニュー">
    <div class="brand"><span class="logo"></span><div><b>ONE CIRCLE</b><small>人脈ノート</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="meBox"></div>
  </aside>
  <div class="content">
    <div class="mtop"><span class="logo"></span><div><b style="font-weight:800">ONE CIRCLE</b> <span class="muted small">人脈ノート</span></div></div>
    <div id="banner"></div>
    <main id="main"><div class="empty">読み込み中…</div></main>
  </div>
</div>
<nav class="bnav" id="bnav" aria-label="メニュー"></nav>
<div role="status" aria-live="polite" class="toast" id="toast" hidden></div>

<script>
/* ============ 定数・設定 ============ */
const PHASES = {none:"未提案", proposed:"提案", connected:"つないだ", won:"成立", ended:"終了", lost:"見送り"};
const PHASE_RANK = {none:0,lost:0,proposed:1,connected:2,won:3,ended:3};
const DEFAULT_BIZ = [
  {key:"jinzai", name:"人材", color:"--b-jinzai", entry:"昼の仕事を探している／職場を変えたい／地方から働きたい", reward:"紹介1人につき月2万円（稼働中は毎月）。2027年1月開始",
   statuses:[["未提案","none"],["提案済","proposed"],["面談・調整中","connected"],["稼働中","won"],["稼働終了","ended"],["見送り","lost"]]},
  {key:"event", name:"イベント", color:"--b-event", entry:"有名になりたい／イベントに出たい・作りたい", reward:"キャンプ参加者の紹介1名につき3万円。次回MASHUPは2027年4月頃",

function call(action, payload){
  return new Promise((resolve, reject)=>{
    if(!(window.google && google.script && google.script.run)){
      fetch(API_URL,{method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({key:BOOT.key||"", action, payload:payload||{}})})
        .then(r=>r.json()).then(o=> o.ok ? resolve(o.data) : reject({code:o.error}))
        .catch(e=>reject({code:"network", message:String(e&&e.message||e)}));
      return;
    }
    google.script.run
      .withSuccessHandler(r=>{ let o; try{ o=JSON.parse(r); }catch(_){ reject({code:"bad_response"}); return; } o.ok ? resolve(o.data) : reject({code:o.error}); })
      .withFailureHandler(e=>reject({code:"network", message:String(e&&e.message||e)}))
      .api(BOOT.key||"", action, JSON.stringify(payload||{}));
  });
}

function monthLogs(mk){ return S.logs.filter(l => (l.date||"").startsWith(mk)); }
function countMetrics(mk){

function paceInfo(mk){
  const now = new Date(); const [y,m] = mk.split("-").map(Number);
  const dim = new Date(y,m,0).getDate(); const cur = monthKey(now);
  const elapsed = mk < cur ? dim : mk > cur ? 0 : now.getDate();
  return {dim, elapsed, ratio: elapsed/dim, left: dim-elapsed};
}

function followUps(){

function ring(p, size=36){
  const bs = biz(); const n = bs.length; const r = size/2-3; const c = size/2; const gap = 0.16;
  let s = `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">`;
  bs.forEach((b,i)=>{
    const a0 = (i/n)*2*Math.PI - Math.PI/2 + gap/2, a1 = ((i+1)/n)*2*Math.PI - Math.PI/2 - gap/2;
    const st = p && p.biz && p.biz[b.key]; const ph = st ? phaseOf(b.key, st.status) : "none";
    const op = {none:.14,proposed:.45,connected:.72,won:1,ended:.32,lost:.14}[ph];
    const x0=c+r*Math.cos(a0), y0=c+r*Math.sin(a0), x1=c+r*Math.cos(a1), y1=c+r*Math.sin(a1);
    s += `<path d="M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" fill="none" stroke="var(${b.color})" stroke-opacity="${op}" stroke-width="${size>40?5.5:4}" stroke-linecap="round"/>`;
  });
  return s + `</svg>`;
}

function dueLabel(due){

      pace = v>=goal ? `<span class="pace ahead">達成</span>` : diff>0?`<span class="pace ahead">+${diff}</span>` : diff<0?`<span class="pace behind">${diff}</span>`:`<span class="pace even">±0</span>`;
    }
    return `<div class="kpi"><div class="between"><span class="lab">${m.label}</span>${pace}</div>
      <div class="val">${v}${goal?`<small> / ${goal}</small>`:""}</div>
      ${goal?`<div class="bar"><i style="width:${Math.min(100,v/goal*100)}%"></i><b style="left:${(pi.ratio*100).toFixed(1)}%" title="今日時点の目標ペース"></b></div>`:`<div class="hint" style="margin:0">目標未設定</div>`}
    </div>`;
  }).join("") + `</div>`;
}
function vHome(){

    return `<li><span class="when late">${x.days}日</span><div class="body"><a class="who" href="#person-${x.p.id}">${nameOf(x.p)}</a>　${bizChip(x.b.key,x.st.status)} のまま動きなし。結果を聞いて「戻す」</div>${S.canWrite?`<button class="btn sm" data-act="openRecord" data-pid="${x.p.id}">結果を記録</button><button class="btn sm" data-act="newHo" data-pid="${x.p.id}">LINE共有</button>`:""}</li>`;
  }).join("") + `</ul>` : `<p class="muted" style="margin:0">期限が近いアクションはありません。</p>`;
  const cols = ["proposed","connected","won","ended","lost"];
  const pipe = `<div class="scroll-x"><table class="tbl"><thead><tr><th>事業</th>${cols.map(c=>`<th>${PHASES[c]}</th>`).join("")}</tr></thead><tbody>` +
    biz().map(b=>{
      const cnt = {proposed:0,connected:0,won:0,ended:0,lost:0};
      for(const p of people){ const st=p.biz&&p.biz[b.key]; if(st){ const ph=phaseOf(b.key,st.status); if(ph in cnt) cnt[ph]++; } }
      return `<tr><td>${bizChip(b.key)}</td>${cols.map(c=>`<td><a href="#list" data-act="filterTo" data-biz="${b.key}" data-phase="${c}" style="text-decoration:none"><span class="n ${cnt[c]?"":"z"}">${cnt[c]}</span></a></td>`).join("")}</tr>`;
    }).join("") + `</tbody></table></div>`;
  return `${hd}<div class="stack">
    <section class="card"><div class="sec-title"><h2>今やること</h2><span class="muted">${todo.length}件</span></div>${todoHtml}${todo.length>12?`<button class="btn" data-act="toggleTodos">${S.ui.allTodos?"12件に戻す":"すべて表示"}</button>`:""}</section>
    ${kpiTiles(mk)}
    ${ns.length?`<div class="notice ai"><span class="ailabel">${icon("spark")} AI</span> <b>面談の解析がまだの人が${ns.length}人います。</b>文字起こしを貼ると、伝える内容と次のアクションが入ります。<div class="row" style="margin-top:8px">${ns.slice(0,6).map(p=>`<a class="chip" href="#person-${p.id}">${nameOf(p)}</a>`).join("")}</div></div>`:""}
    <div class="grid2">
      <section class="card"><div class="sec-title"><h2>事業別パイプライン</h2><span class="muted">数字を押すと一覧へ</span></div>${pipe}
        <p class="hint">「提案・つないだ」のまま7日動きがないと、今やることに「戻す」が出ます。</p></section>
    </div>
    <section class="card"><div class="sec-title"><h2>行動カレンダー</h2><span class="muted">日ごとの記録件数</span></div>${heatmap(mk)}</section>
  </div>`;
}
function heatmap(mk){
  const [y,m]=mk.split("-").map(Number); const first=new Date(y,m-1,1); const dim=new Date(y,m,0).getDate();
  const cnt={}; for(const l of monthLogs(mk)) if(l.type!=="note") cnt[l.date]=(cnt[l.date]||0)+1;
  let h = `<div class="cal">` + ["日","月","火","水","木","金","土"].map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<first.getDay();i++) h+=`<div></div>`;
  const t=today();
  for(let d=1; d<=dim; d++){
    const k=`${mk}-${pad(d)}`; const n=cnt[k]||0; const lv = n===0?"":n<3?"l1":n<6?"l2":"l3";
    h += `<div class="d ${lv} ${k===t?"today":""}" title="${md(k)}：${n}件"><span>${d}</span>${n?`<b>${n}</b>`:""}</div>`;
  }
  return h + `</div>`;
}

function vList(){

  if(f.temp) ps = ps.filter(p=>p.temp===f.temp);
  if(f.biz) ps = ps.filter(p=>{ const st=p.biz&&p.biz[f.biz]; const ph=st?phaseOf(f.biz,st.status):"none"; return f.phase ? ph===f.phase : ph!=="none"; });
  else if(f.phase) ps = ps.filter(p=>biz().some(b=>{ const st=p.biz&&p.biz[b.key]; return st && phaseOf(b.key,st.status)===f.phase; }));
  const nextDue = p => ((p.actions||[]).filter(a=>!a.done).map(a=>a.due||"9999").sort()[0]) || "9999";

function ageText(value){ const v=String(value||"").trim(); return /^\d+$/.test(v)?v+"歳":v; }
function profileValue(key,value){
  if(!value) return '<span class="muted">未入力</span>';
  if(key==="sns"){
    try{ const u=new URL(value); if(["https:","http:"].includes(u.protocol)){
      const host=u.hostname.toLowerCase(); const label=host==="instagram.com"||host.endsWith(".instagram.com")?"Instagram":host==="line.me"?"LINE":"連絡先";
      return `<a href="${esc(u.href)}" target="_blank" rel="noopener noreferrer">${label}を開く ↗</a>`;
    } }catch(_){}
  }
  return esc(key==="age"?ageText(value):value);
}
function profileGroups(p,W){
  return [["基本",["age","job","area","family"]],["つながり",["relation","referrer","sns"]],["人柄・趣味",["personality","hobbies"]]].map(([title,keys])=>`<section><h3>${title}</h3><dl class="kv">${keys.map(k=>{

let aiCtl = {};
const aiErr = e => ({cancelled:"", no_key:"AIのキーが設定されていません。「AI用にコピー」から手動で使えます。", refused:"AIがこの内容への回答を控えました。文面を変えるか、手動で入力してください。", rate_limited:"AIの利用が混み合っています。少し待ってからもう一度押してください。", invalid_json:"AIの返答を読み取れませんでした。もう一度押すか、文字起こしを短くしてください。", prompt_too_large:"文字起こしが長すぎます。半分ずつ解析してください。"}[e && e.code] ?? "AIに接続できませんでした。もう一度お試しください。");
async function runAnalyze(id){
  const p=S.people.get(id); const tr=draft("tr_"+id).trim();
  if(!tr){ S.ai[id]={msg:"文字起こしを貼り付けてください"}; render(); return; }
  aiCtl[id]?.abort(); aiCtl[id]=new AbortController();
  S.ai[id]={busy:true}; render();
  try{
    const r = await S.sample.json(analysisPrompt(p,tr));
    if(!r || typeof r!=="object") throw {code:"invalid_json"};
    S.ai[id]={result:r};
  }catch(e){
    if(e.code==="not_granted"||e.code==="sampling_disabled") S.sample=null;
    S.ai[id]={msg: aiErr(e)};
  }
  render();
}
async function applyAI(id){
  const p=S.people.get(id); const r=S.ai[id].result; const off={};
  document.querySelectorAll("[data-apply]").forEach(el=>{ if(!el.checked) off[el.dataset.apply]=true; });
  const patch={}; const date=draft("trd_"+id,today());
  if(r.summary) patch.summary=r.summary;
  if(!off.profile){ const pr={}; for(const [k,v] of Object.entries(r.profile||{})) if(v && PROFILE_FIELDS.some(f=>f[0]===k)) pr[k]=String(v); if(Object.keys(pr).length) patch.profile=pr; }
  if(!off.needs){ patch.needs=uniq([...(p.needs||[]),...(r.needs||[])]); patch.frustrations=uniq([...(p.frustrations||[]),...(r.frustrations||[])]); }
  if(!off.talk){ if((r.talkPoints||[]).length) patch.talkPoints=r.talkPoints.map(String); if((r.avoid||[]).length) patch.avoid=r.avoid.map(String); }
  if(!off.fit && (r.fit||[]).length){ patch.fit={}; for(const f of r.fit) if(bizBy(f.biz)) patch.fit[f.biz]={level:String(f.level||""),reason:String(f.reason||"")}; }
  if(!off.temp && ["A","B","C"].includes(r.temp)) patch.temp=r.temp;
  if(!off.actions && (r.nextActions||[]).length) patch.actions=[...(p.actions||[]), ...r.nextActions.map(a=>({id:uid(),text:String(a.text||""),due:/^\d{4}-\d\d-\d\d$/.test(a.due||"")?a.due:"",done:false}))];
  await safe(async()=>{
    await store.updatePerson(id,patch);
    if(!off.status) for(const u of (r.statusUpdates||[])){ const b=bizBy(u.biz); if(b && b.statuses.some(s=>s[0]===u.status)) await changeStatus(id,u.biz,u.status,date); }
    if(!off.log) await store.addLog({personId:id,type:"meeting",date,text:r.summary||"面談"});
  },"反映しました");
  delete S.ai[id]; delete S.d["tr_"+id]; delete S.d["js_"+id]; render();
}
async function changeStatus(id, bk, status, date){
  const ph = phaseOf(bk,status);
  await store.updatePerson(id,{biz:{[bk]:{status,updatedAt:new Date().toISOString()}}});
  await store.addLog({personId:id,type:PHASE_TO_LOG[ph]||"note",biz:bk,date:date||today(),text:`${bizBy(bk).name}：${status}`});
}

async function saveHo(markSent){
  const data=hoData(); if(!data.personId){ toast("つなぐ人を選んでください"); return; }
  const id=S.ui.hoId || uid(); const prev = S.handoffs.find(h=>h.id===id);
  const wasSent = prev && prev.status==="sent";
  if(markSent) data.status="sent";
  S.ui.hoId=id;
  await safe(async()=>{
    await store.saveHandoff(id,data);
    if(markSent && !wasSent){
      await store.addLog({personId:data.personId,type:"connect",biz:data.biz||"",text:`${data.kind||"面談"}につなぐ依頼をリーダーに送った${data.datetime?`（${mdt(data.datetime)}）`:""}`});
      const p=S.people.get(data.personId); const b=bizBy(data.biz);
      if(p && b){ const curSt=((p.biz||{})[b.key]||{});
        if(PHASE_RANK[phaseOf(b.key,curSt.status)]<2){ const target=b.statuses.find(s=>s[1]==="connected"); if(target) await store.updatePerson(p.id,{biz:{[b.key]:{status:target[0],updatedAt:new Date().toISOString(),owner:data.manager||curSt.owner||""}}}); } }
    }
    if(data.talked.trim() && !(prev && (prev.talked||"").trim())){
      await store.addLog({personId:data.personId,type:"report",biz:data.biz||"",date:(data.datetime||today()).slice(0,10),text:`【${data.kind||"面談"}の結果】${data.talked}${data.feedback?`\nFB：${data.feedback}`:""}`});
    }
  }, markSent?"送信済みにしました":"保存しました");
  render();
}

function shareCandidates(){
  const t=today(); const since=ymd(new Date(Date.now()-14*864e5));
  return [...S.people.values()].map(p=>{
    const recent = S.logs.some(l=>l.personId===p.id && l.date>=since);
    const soon = (p.actions||[]).some(a=>!a.done && a.due && daysBetween(t,a.due)<=7);
    return {p, score:(recent?2:0)+(soon?1:0)+(p.temp==="A"?1:0)};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.p);
}
function shareText(sel){
  const mk=monthKey(new Date()), c=countMetrics(mk), g=goalsFor(mk); const pi=paceInfo(mk);
  const nums = METRICS.filter(m=>m.key!=="new").map(m=>`${m.label}${c[m.key]}${g[m.key]?`/${g[m.key]}`:""}`).join("・");
  const ppl = sel.map(id=>S.people.get(id)).filter(Boolean).map(p=>{
    const act = biz().map(b=>{const st=(p.biz||{})[b.key]; const ph=st&&phaseOf(b.key,st.status); return ph&&ph!=="none"&&ph!=="lost"?`${b.name}：${st.status}`:""}).filter(Boolean).join("、");
    const na = (p.actions||[]).filter(a=>!a.done).sort((a,b)=>(a.due||"9").localeCompare(b.due||"9"))[0];
    const out = [`・${p.name}さん［${act||"関係づくり中"}］温度感${p.temp||"—"}`];
    if((p.needs||[]).length||(p.frustrations||[]).length) out.push(`　ニーズ：${[...(p.needs||[]).slice(0,1),...(p.frustrations||[]).slice(0,1)].join("／")}`);
    if((p.talkPoints||[]).length) out.push(`　伝えること：${p.talkPoints[0]}`);
    if(na) out.push(`　次：${na.due?md(na.due)+" ":""}${na.text}`);
    return out.join("\n");
  });
  const fu = followUps().length + hoBacklog().length; const lateN = openActions().filter(x=>x.a.due&&x.a.due<today()).length;
  const ask = draft("share_ask", S.config.shareAsk||"").trim();
  return [
    `【${meName()||"私"}の人脈リスト｜${md(today())}時点】`,
    `■ 今月（${pi.elapsed}/${pi.dim}日）${nums}`,
    `■ リスト${S.people.size}人${lateN?`・期限切れ${lateN}件`:""}${fu?`・戻す待ち${fu}件`:""}`,
    ppl.length?`■ 動いている人（${ppl.length}人）\n${ppl.join("\n")}`:"",
    ask?`■ 相談したいこと\n${ask}`:"",
  ].filter(Boolean).join("\n");
}

function vGoals(){
  const now=new Date(); const mk = S.ui.goalMonth || monthKey(now);
  const [y,m]=mk.split("-").map(Number);
  const prev = monthKey(new Date(y,m-2,1)), next = monthKey(new Date(y,m,1));
  const c=countMetrics(mk), g=goalsFor(mk), pi=paceInfo(mk), pc=countMetrics(prev);
  const W=S.canWrite;
  const rows = METRICS.map(mt=>{
    const v=c[mt.key], goal=+g[mt.key]||0; const rest=Math.max(0,goal-v);
    const perWeek = pi.left>0 && rest ? rest/pi.left*7 : 0; const d = v - pc[mt.key];
    return `<tr>
      <td><b>${mt.label}</b><div class="muted small">${mt.desc}</div></td>
      <td class="num" style="font-size:18px;font-weight:700">${v}</td>
      <td>${W?`<input id="g_${mt.key}" type="number" min="0" style="width:80px" data-d="g_${mk}_${mt.key}" value="${esc(draft("g_"+mk+"_"+mt.key, g[mt.key]??""))}" aria-label="${mt.label}の目標">`:`<span class="num">${goal||"—"}</span>`}</td>
      <td style="min-width:140px">${goal?`<div class="bar"><i style="width:${Math.min(100,v/goal*100)}%"></i><b style="left:${(pi.ratio*100).toFixed(1)}%"></b></div><div class="small muted num">${Math.round(v/goal*100)}%</div>`:"—"}</td>
      <td class="small">${!goal?"—":rest===0?`<span class="pace ahead">達成</span>`:pi.left>0?`あと${rest}・<b>週${perWeek<1?perWeek.toFixed(1):Math.ceil(perWeek)}</b>ペース`:`<span class="pace behind">あと${rest}で終了</span>`}</td>
      <td class="small num" style="color:${d>0?"var(--ok)":d<0?"var(--bad)":"var(--sub)"}">${d>0?"+":""}${d}</td>
    </tr>`;
  }).join("");
  const days=[]; for(let i=29;i>=0;i--) days.push(ymd(new Date(Date.now()-i*864e5)));
  const per = days.map(d=>S.logs.filter(l=>l.date===d && l.type!=="note").length);
  const mx = Math.max(4,...per); const W2=600,H=120,bw=W2/30;
  const svg = `<svg viewBox="0 0 ${W2} ${H+22}" style="width:100%;height:auto;display:block" role="img" aria-label="直近30日の行動件数">
    ${[0.5,1].map(f=>`<line x1="0" x2="${W2}" y1="${(H-H*f).toFixed(1)}" y2="${(H-H*f).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="2" y="${(H-H*f+11).toFixed(1)}" font-size="10" fill="var(--sub)">${Math.round(mx*f)}</text>`).join("")}
    ${per.map((n,i)=>`<rect x="${(i*bw+2).toFixed(1)}" y="${(H-n/mx*H).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${(n/mx*H).toFixed(1)}" rx="3" fill="var(--accent)" fill-opacity="${days[i]===today()?1:.55}"><title>${md(days[i])}：${n}件</title></rect>`).join("")}
    <line x1="0" x2="${W2}" y1="${H}" y2="${H}" stroke="var(--line)"/>
    ${[0,7,14,21,29].map(i=>`<text x="${(i*bw+bw/2).toFixed(1)}" y="${H+15}" font-size="10" text-anchor="middle" fill="var(--sub)">${md(days[i])}</text>`).join("")}
  </svg>`;
  const theme = draft("theme_"+mk, (S.config.themes||{})[mk]||"");
  return `${head(`${y}年${m}月の目標`, `${pi.elapsed}/${pi.dim}日経過（${Math.round(pi.ratio*100)}%）・縦線＝今日時点の目標ペース`, `<button class="btn sm" data-act="goalMonth" data-mk="${prev}">← 前の月</button><button class="btn sm" data-act="goalMonth" data-mk="${next}">次の月 →</button>`)}
  <div class="stack">
    <section class="card">
      <label class="f" style="margin-bottom:14px">今月のテーマ（自分で決めたこと）${W?`<input id="theme_in" type="text" data-d="theme_${mk}" value="${esc(theme)}" placeholder="例：サークル経由で人材に3人つなぐ">`:`<span>${esc(theme)||"—"}</span>`}</label>
      <div class="scroll-x"><table class="tbl"><thead><tr><th>指標</th><th>実績</th><th>目標</th><th>進み具合</th><th>この先</th><th>先月比</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${W?`<div class="row" style="margin-top:14px"><button class="btn pri" data-act="saveGoals" data-mk="${mk}">目標を保存</button><button class="btn" data-act="copyGoals" data-mk="${mk}" data-from="${prev}">先月の目標を写す</button></div>`:""}
      <p class="hint">数字は記録から自動で数えます。事業のステータスを変える・面談を解析する・LINE共有で「送った」を押す・連絡を記録する、で増えます。</p>
    </section>
    <section class="card"><div class="sec-title"><h2>直近30日の行動量</h2><span class="muted">1日あたりの記録件数</span></div>${svg}</section>
    ${W&&isAdmin()?settingsPanel():""}
  </div>`;
}

/* 保存系のボタンは、処理中にもう一度押されても無視する（二重登録の防止） */
const INFLIGHT = new Set();
const GUARDED = ["saveInline","createPerson","saveProfile","addAction","doneAction","dropAction","addLog","delLog","delPerson","applyAI","loadJson","saveHo","sentHo","delHo","saveTpl","resetTpl","saveGoals","saveBiz","addBiz","addMember","memberOp"];
document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-act]"); if(!el || el.tagName==="SELECT" || (el.tagName==="INPUT"&&el.type==="checkbox")) return;
  const a=el.dataset.act, pid=el.dataset.pid;
  if(GUARDED.includes(a)){
    const k=a+":"+(pid||"");
    if(INFLIGHT.has(k)) return;
    INFLIGHT.add(k); el.disabled=true; el.setAttribute("aria-busy","true");
    try{ await onAct(e, el, a, pid); }
    finally{ INFLIGHT.delete(k); if(el.isConnected){ el.disabled=false; el.removeAttribute("aria-busy"); } }
    return;
  }
  await onAct(e, el, a, pid);
});
async function onAct(e, el, a, pid){
  const p = pid && S.people.get(pid);
  if(!S.canWrite && ["editInline","saveInline","editProfile","saveProfile","actionDate","logType"].includes(a)) return;
  switch(a){
    case "editInline": S.ui.inlineProfile=pid+":"+el.dataset.field; render(); return;
    case "cancelInline": S.ui.inlineProfile=null; render(); return;
    case "saveInline": {
      const k=el.dataset.field; if(!p||!PROFILE_FIELDS.some(f=>f[0]===k)) return;
      const saved=await safe(()=>store.updatePerson(pid,{profile:{[k]:draft("ip_"+pid+"_"+k,(p.profile||{})[k]||"").trim()}}),"保存しました");
      if(saved){ S.ui.inlineProfile=null; delete S.d["ip_"+pid+"_"+k]; } render(); return;
    }
    case "logType": S.d["lt_"+pid]=el.dataset.type; render(); return;
    case "actionDate": S.d["nd_"+pid]=actionDate(Number(el.dataset.days)); render(); return;

    case "toggleTodos": S.ui.allTodos=!S.ui.allTodos; render(); return;
    case "openRecord":
      S.ui.recordTarget=pid;
      if(location.hash!=="#person-"+pid) location.hash="#person-"+pid;
      else { render(); $("#person-record").scrollIntoView({block:"start"}); $("#lg_text")?.focus(); }
      return;
    case "quickLog": {
      if(!S.canWrite || !p || S.ui.quickSaving) return;
      const type=el.dataset.type;
      if(!["contact","meeting"].includes(type)) return;
      S.ui.quickSaving=true; el.disabled=true;
      try{ await safe(()=>store.addLog({personId:pid,type,date:today(),text:""}),LOG_TYPES[type]+"を今日の記録に追加しました"); }
      finally{ S.ui.quickSaving=false; render(); }
      return;
    }
    case "filterTo": S.ui.filters={q:"",temp:"",biz:el.dataset.biz,phase:el.dataset.phase}; break;
    case "createPerson": {
      const name=draft("n_name").trim(); if(!name){ toast("名前を入れてください"); return; }
      // 同じ入力内容での再送は同じIDを使う（通信が遅くて押し直しても1人分にしかならない）
      const id=S.d.n_id || (S.d.n_id=uid()); const now=new Date().toISOString();
      el.textContent="追加中…";
      const data={name,kana:draft("n_kana").trim(),entry:draft("n_entry"),temp:draft("n_temp"),consent:!!draft("n_consent",false),memo:draft("n_memo").trim(),
        profile:{job:draft("n_job").trim(),area:draft("n_area").trim(),age:draft("n_age").trim(),relation:draft("n_relation").trim(),sns:draft("n_sns").trim(),referrer:draft("n_referrer").trim()},biz:{},needs:[],frustrations:[],talkPoints:[],avoid:[],actions:[],createdAt:now,updatedAt:now};
      const ok=await safe(async()=>{ await store.setPerson(id,data); if(!S.logs.some(l=>l.personId===id && l.type==="new")) await store.addLog({personId:id,type:"new",text:"リストに追加"}); },"追加しました");
      if(!ok){ el.textContent="追加して開く"; return; }
      for(const k of Object.keys(S.d)) if(k.startsWith("n_")) delete S.d[k];
      location.hash="#person-"+id; return;
    }
    case "editProfile": S.ui.editProfile=pid; for(const k of Object.keys(S.d)) if(k.startsWith("e_")) delete S.d[k]; render(); return;
    case "cancelProfile": S.ui.editProfile=null; render(); return;
    case "saveProfile": {
      const pr={}; for(const [k] of PROFILE_FIELDS) pr[k]=draft("e_"+k,(p.profile||{})[k]||"").trim();
      const patch={name:draft("e_name",p.name).trim()||p.name,kana:draft("e_kana",p.kana||"").trim(),profile:pr,entry:draft("e_entry",p.entry||""),temp:draft("e_temp",p.temp||""),consent:!!draft("e_consent",!!p.consent),memo:draft("e_memo",p.memo||"").trim(),
        needs:lines(draft("e_needs",(p.needs||[]).join("\n"))),frustrations:lines(draft("e_frus",(p.frustrations||[]).join("\n"))),talkPoints:lines(draft("e_talk",(p.talkPoints||[]).join("\n"))),avoid:lines(draft("e_avoid",(p.avoid||[]).join("\n")))};
      const saved=await safe(()=>store.updatePerson(pid,patch),"保存しました"); if(saved) S.ui.editProfile=null; render(); return;

      for(const k of Object.keys(S.d)) if(k.startsWith("g_"+mk)) delete S.d[k]; render(); return;
    }
    case "copyGoals": { const g=goalsFor(el.dataset.from); if(!Object.keys(g).length){ toast("先月の目標がありません"); return; } for(const m of METRICS) if(g[m.key]!=null) S.d["g_"+el.dataset.mk+"_"+m.key]=String(g[m.key]); render(); return; }
    case "saveBiz": {
      const bs = biz().map((b,i)=>{
        const st = lines(draft("bz_s"+i,b.statuses.map(s=>s.join(" | ")).join("\n"))).map(l=>{ const [n,ph]=l.split("|").map(s=>s.trim()); return [n, PHASES[ph]?ph:"proposed"]; }).filter(s=>s[0]);
        if(!st.length || st[0][1]!=="none") st.unshift(["未提案","none"]);
        return {...b,name:draft("bz_n"+i,b.name).trim()||b.name,entry:draft("bz_e"+i,b.entry||""),reward:draft("bz_r"+i,b.reward||""),statuses:st};
      });
      for(const k of Object.keys(S.d)) if(k.startsWith("bz_")) delete S.d[k];
      await safe(()=>store.saveConfig({businesses:bs}),"設定を保存しました"); render(); return;
    }
    case "addBiz": {
      const palette=["--b-jinzai","--b-event","--b-estate","--b-school","--b-beauty","--b-circle"];
      const bs=[...biz(),{key:"biz"+Date.now().toString(36),name:"新しい事業",color:palette[biz().length%6],entry:"",reward:"",statuses:[["未提案","none"],["提案済","proposed"],["つないだ","connected"],["成立","won"],["見送り","lost"]]}];
      await safe(()=>store.saveConfig({businesses:bs}),"事業を追加しました（名前を変えて保存してください）"); render(); return;
    }
  }
}

/* ============ 起動 ============ */
function makeAI(){
  const f = async (prompt) => ({text: await call("ai",{prompt})});
  f.json = async (prompt) => {
    const t = await call("ai",{prompt});
    const m = String(t).match(/\{[\s\S]*\}/);
    try{ return JSON.parse(m?m[0]:t); }catch(_){ throw {code:"invalid_json"}; }
  };
  return f;
}
async function loadData(view){
  S.mode = "loading"; render();
  try{
    const d = await call("bootstrap",{view:view||""});
    S.me = d.me; S.target = d.target; S.members = d.members||[];
    S.viewingOther = d.target.id !== d.me.id;
    S.canWrite = !S.viewingOther;
    S.sample = d.ai ? makeAI() : null;
    S.config = deepMerge(JSON.parse(JSON.stringify(d.global||{})), d.mine||{});
    S.people = new Map((d.people||[]).map(p=>[p.id,p]));
    S.logs = (d.logs||[]).sort((a,b)=>(b.date||"").localeCompare(a.date||"") || (b.createdAt||"").localeCompare(a.createdAt||""));
    S.handoffs = d.handoffs||[];
    S.d = {}; S.ai = {}; S.ui.shareSel = null; S.ui.hoOpen = false; S.ui.hoId = null; S.team = null;
    S.mode = "ready";
  }catch(e){
    console.error(e);
    S.mode = e && (e.code==="invalid_key") ? "nokey" : e && e.code==="offline" ? "offline" : "error";
  }
  render();
}
async function loadTeam(){
  S.team = "loading"; render();
  try{ S.team = await call("teamSummary",{}); }catch(e){ S.team = "error"; }
  render();
}
loadData();
</script>
